[project]
name = "frappe-connector"
version = "0.2.0"
description = "A lightweight Python client for connecting and interacting with Frappe instances"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
dependencies = [
    "requests",
]

[project.scripts]
fcn = "frappe_connector.cli:main"
frappe-connector = "frappe_connector.cli:main"
frappe-connector-mcp = "frappe_connector.mcp_server:main"

[project.urls]
Homepage = "https://github.com/nitefury7/frappe_connector"

[project.optional-dependencies]
mcp = [
    "mcp>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frappe_connector"]

[dependency-groups]
dev = [
    "pytest",
    "responses>=0.26.3",
]
